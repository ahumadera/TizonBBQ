document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

path d=\"M9 8V5h6v3\"><\u002Fpath><path d=\"M12 12v4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--ember-orange);letter-spacing:0.1em;\">04<\u002Fspan>\n          <h4 style=\"font-family:var(--font-display);font-weight:600;font-size:19px;letter-spacing:0.04em;text-transform:uppercase;margin:0;color:var(--bone);\">Sellado al vacío<\u002Fh4>\n          <p style=\"font-size:13.5px;line-height:1.55;color:var(--bone);opacity:0.8;margin:0;\">Empacado fresco y listo para llegar a tu casa.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== HISTORIA ===== -->\n  <section id=\"historia\" style=\"max-width:1180px;margin:0 auto;padding:64px 24px;display:grid;grid-template-columns:0.9fr 1.1fr;gap:48px;align-items:center;\">\n    <div style=\"position:relative;aspect-ratio:1/1;border:1px solid var(--smoke);border-radius:var(--radius-sm);overflow:hidden;\">\n      <image-slot id=\"tz-historia\" shape=\"rect\" fit=\"cover\" placeholder=\"Foto del proceso: manos, brasa, corte de la carne\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-family:var(--font-mono);font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:var(--ember-orange);margin-bottom:12px;\">La Casa<\u002Fdiv>\n      <h2 style=\"font-family:var(--font-display);font-weight:700;font-size:38px;letter-spacing:0.04em;text-transform:uppercase;margin:0 0 18px;color:var(--bone);\">Carne, humo y oficio<\u002Fh2>\n      <p style=\"font-size:15.5px;line-height:1.65;color:var(--bone);opacity:0.85;margin:0 0 16px;\">Tizón BBQ nace de una obsesión simple: hacer el mejor jerky de El Salvador con 100% carne de res prime. La cortamos a mano y la curamos con calma antes de acercarla al fuego.<\u002Fp>\n      <p style=\"font-size:15.5px;line-height:1.65;color:var(--bone);opacity:0.85;margin:0 0 26px;\">Ahumamos a leña en lotes pequeños porque es la única forma de cuidar cada tira. Sabor real, humo real, hecho a mano.<\u002Fp>\n      <div style=\"border-left:4px solid var(--ember-orange);background:var(--bone);color:var(--carbon);padding:18px 20px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;\">\n        <div style=\"display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ember-red);margin-bottom:8px;\">\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l7 3v5c0 4.2-2.8 7.3-7 8.5C7.8 18.3 5 15.2 5 11V6z\"><\u002Fpath><path d=\"M9.5 12l1.8 1.8 3.2-3.4\"><\u002Fpath><\u002Fsvg>\n          Hecho con oficio\n        <\u002Fdiv>\n        <p style=\"font-family:var(--font-body);font-size:13px;line-height:1.5;margin:0 0 6px;\">Producto artesanal elaborado en pequeños lotes en El Salvador, con 100% carne de res prime.<\u002Fp>\n        <p style=\"font-family:var(--font-mono);font-size:12px;letter-spacing:0.04em;margin:0;color:var(--smoke);\">Registro Sanitario MINSAL N.º ____<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== CTA FINAL ===== -->\n  <section style=\"max-width:1180px;margin:0 auto;padding:12px 24px 72px;\">\n    <div style=\"background:var(--smoke);border-radius:var(--radius-sm);padding:52px 40px;text-align:center;position:relative;overflow:hidden;\">\n      <img src=\"a5af1c3a-ee9c-4b03-ae6a-213e94626570\" alt=\"\" style=\"width:64px;height:64px;border-radius:50%;margin-bottom:20px;\">\n      <h2 style=\"font-family:var(--font-display);font-weight:700;font-size:34px;letter-spacing:0.04em;text-transform:uppercase;margin:0 0 12px;color:var(--bone);\">¿Listo para pedir?<\u002Fh2>\n      <p style=\"font-size:15px;color:var(--bone);opacity:0.82;max-width:440px;margin:0 auto 26px;\">Armá tu pedido en la tienda o escribinos directo. Entregas coordinadas por WhatsApp.<\u002Fp> https://tiktok.com/@tizon_bbq\" target=\"_blank\" style=\"color:var(--bone);\">TikTok @tizon_bbq<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <!-- ===== CART DRAWER ===== -->\n  <sc-if value=\"{{ cartOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:60;\">\n      <div sc-camel-on-click=\"{{ toggleCart }}\" style=\"position:absolute;inset:0;background:rgba(10,8,6,0.6);\"><\u002Fdiv>\n      <aside style=\"position:absolute;top:0;right:0;height:100%;width:min(420px,92vw);background:var(--carbon);border-left:1px solid var(--smoke);display:flex;flex-direction:column;\">\n        <div style=\"padding:22px 24px;border-bottom:1px solid var(--smoke);display:flex;align-items:center;justify-content:space-between;\">\n          <span style=\"font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:0.06em;text-transform:uppercase;color:var(--bone);\">Tu pedido<\u002Fspan>\n          <button sc-camel-on-click=\"{{ toggleCart }}\" style=\"background:transparent;border:none;color:var(--bone);font-size:24px;cursor:pointer;line-height:1;font-family:var(--font-body);\">×<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"flex:1;overflow-y:auto;padding:12px 24px;\">\n          <sc-if value=\"{{ cartEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"text-align:center;padding:60px 20px;color:var(--smoke);font-family:var(--font-mono);font-size:13px;letter-spacing:0.04em;\">Tu pedido está vacío.<br>Agregá variantes desde la tienda.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-for list=\"{{ cartLines }}\" as=\"l\" hint-placeholder-count=\"0\">\n            <div style=\"display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--smoke);\">\n              <div style=\"flex:1;\">\n                <div style=\"font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:0.03em;text-transform:uppercase;color:var(--bone);\">{{ l.label }}<\u002Fdiv>\n                <div style=\"font-family:var(--font-mono);font-size:12px;color:var(--smoke);margin-top:2px;\">{{ l.priceLabel }} c/u<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:8px;\">\n                <button sc-camel-on-click=\"{{ l.dec }}\" style=\"width:28px;height:28px;border-radius:var(--radius-sm);background:var(--smoke);color:var(--bone);border:none;cursor:pointer;font-size:16px;font-family:var(--font-body);line-height:1;\">−<\u002Fbutton>\n                <span style=\"font-family:var(--font-mono);font-size:14px;color:var(--bone);min-width:20px;text-align:center;\">{{ l.qty }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ l.inc }}\" style=\"width:28px;height:28px;border-radius:var(--radius-sm);background:var(--smoke);color:var(--bone);border:none;cursor:pointer;font-size:16px;font-family:var(--font-body);line-height:1;\">+<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"font-family:var(--font-mono);font-size:14px;color:var(--ember-orange);min-width:56px;text-align:right;\">{{ l.totalLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"padding:20px 24px 24px;border-top:1px solid var(--smoke);background:var(--carbon);\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;\">\n            <span style=\"font-family:var(--font-mono);font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--smoke);\">Total<\u002Fspan>\n            <span style=\"font-family:var(--font-display);font-weight:700;font-size:30px;color:var(--bone);\">{{ totalLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ checkout }}\" disabled=\"{{ cartEmpty }}\" style=\"width:100%;background:var(--ember-orange);color:var(--carbon);border:none;border-radius:var(--radius-sm);font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:0.08em;text-transform:uppercase;padding:16px;cursor:pointer;\" style-disabled=\"opacity:0.4;cursor:not-allowed;\">Pedir por WhatsApp<\u002Fbutton>\n          <p style=\"font-family:var(--font-mono);font-size:11px;color:var(--smoke);text-align:center;margin:12px 0 0;letter-spacing:0.03em;\">Te abrimos WhatsApp con tu pedido listo para enviar.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { cart: {}, cartOpen: false };\n\n  WA = \"50373435476\";\n  WA_DISPLAY = \"+503 7343-5476\";\n\n  SIZES = [\n    { key: \"1oz\",    label: \"1 oz\",    grams: \"28 g\",  price: 2.49 },\n    { key: \"175oz\",  label: \"1.75 oz\", grams: \"49 g\",  price: 4.49 },\n    { key: \"25oz\",   label: \"2.5 oz\",  grams: \"71 g\",  price: 5.99 },\n  ];\n\n  VARIANTS = [\n    { key: \"umami\",   name: \"Umami-Salado\", accent: \"var(--cured-leather)\", accentText: \"var(--bone)\",\n      tagline: \"Casa\", desc: \"Marinado 12 h en soya y salsa inglesa. Salado profundo, el fondo umami de la casa.\",\n      tags: [\"Contiene soya\", \"Contiene gluten\"], slotHint: \"Bolsa Umami-Salado sobre fondo carbón\",\n      pairDrink: \"Cerveza negra / Stout\", pairNote: \"El tostado de la malta amarra el salado profundo y el humo.\" },\n    { key: \"peppery\", name: \"Peppery Pura\", accent: \"var(--ember-red)\", accentText: \"var(--ember-red)\",\n      tagline: \"Con filo\", desc: \"Pimienta negra cracked, sin distracciones. Seca, masticable, con carácter.\",\n      tags: [\"Sin alérgenos comunes\"], slotHint: \"Bolsa Peppery Pura sobre fondo carbón\",\n      pairDrink: \"Whisky / Bourbon\", pairNote: \"El calor del bourbon abraza la pimienta cracked sin taparla.\" },\n    { key: \"honey\",   name: \"BBQ Honey Ahumado\", accent: \"var(--smoked-amber)\", accentText: \"var(--smoked-amber)\",\n      tagline: \"Dulce-humo\", desc: \"Salsa BBQ propia y miel sobre humo de leña. Dulce que termina en brasa.\",\n      tags: [\"Contiene gluten\"], slotHint: \"Bolsa BBQ Honey Ahumado sobre fondo carbón\",\n      pairDrink: \"Vino tinto joven\", pairNote: \"Una Garnacha o Malbec frutal equilibra el dulce de la miel.\" },\n    { key: \"natural\", name: \"Al Natural\", accent: \"var(--bone)\", accentText: \"var(--bone)\",\n      tagline: \"Sin nada\", desc: \"Solo res, sal y cura. La prueba de la carne y el ahumado, sin nada que esconder.\",\n      tags: [\"Sin alérgenos comunes\"], slotHint: \"Bolsa Al Natural sobre fondo carbón\",\n      pairDrink: \"Café negro / Cold brew\", pairNote: \"El amargo limpio realza la carne pura y el ahumado a leña.\" },\n  ];\n\n  COMBOS = [\n    { key: \"degustacion\", name: \"Combo Degustación\", price: 16.16, was: 17.96,\n      desc: \"Las cuatro variantes en 1.75 oz. La forma más fácil de encontrar tu favorita.\",\n      items: [\"1× Umami-Salado 1.75 oz\", \"1× Peppery Pura 1.75 oz\", \"1× BBQ Honey 1.75 oz\", \"1× Al Natural 1.75 oz\"] },\n    { key: \"agrandado\", name: \"Combo Agrandado\", price: 21.56, was: 23.96,\n      desc: \"Las cuatro variantes en 2.5 oz. Para la despensa o para compartir.\",\n      items: [\"1× Umami-Salado 2.5 oz\", \"1× Peppery Pura 2.5 oz\", \"1× BBQ Honey 2.5 oz\", \"1× Al Natural 2.5 oz\"] },\n    { key: \"picante\", name: \"Combo Picante\", price: 14.9, was: 16.47,\n      desc: \"Doble Peppery más un Umami mediano. Para el que le gusta con pimienta.\",\n      items: [\"2× Peppery Pura 2.5 oz\", \"1× Umami-Salado 1.75 oz\"] },\n  ];\n\n  money(n) { return \"$\" + n.toFixed(2); }\n\n  addItem(id, label, price) {\n    this.setState(s => {\n      const cart = { ...s.cart };\n      cart[id] = cart[id] ? { ...cart[id], qty: cart[id].qty + 1 } : { label, price, qty: 1 };\n      return { cart, cartOpen: true };\n    });\n  }\n  changeQty(id, delta) {\n    this.setState(s => {\n      const cart = { ...s.cart };\n      if (!cart[id]) return {};\n      const q = cart[id].qty + delta;\n      if (q <= 0) delete cart[id]; else cart[id] = { ...cart[id], qty: q };\n      return { cart };\n    });\n  }\n  toggleCart = () => this.setState(s => ({ cartOpen: !s.cartOpen }));\n\n  buildMessage() {\n    const lines = Object.values(this.state.cart)\n      .map(l => `- ${l.qty}× ${l.label} — ${this.money(l.price * l.qty)}`);\n    const total = this.money(this.cartTotal());\n    return `Hola Tizón BBQ, quiero hacer este pedido:\\n\\n${lines.join(\"\\n\")}\\n\\nTotal: ${total}`;\n  }\n  checkout = () => {\n    if (this.cartTotal() <= 0) return;\n    const url = `https://wa.me/${this.WA}?text=${encodeURIComponent(this.buildMessage())}`;\n    window.open(url, \"_blank\");\n  };\n\n  cartTotal() {\n    return Object.values(this.state.cart).reduce((a, l) => a + l.price * l.qty, 0);\n  }\n\n  renderVals() {\n    const variants = this.VARIANTS.map(v => ({\n      name: v.name, accent: v.accent, accentText: v.accentText, tagline: v.tagline,\n      desc: v.desc, tags: v.tags, slotId: \"tz-var-\" + v.key, slotHint: v.slotHint,\n      pairDrink: v.pairDrink, pairNote: v.pairNote,\n      sizes: this.SIZES.map(s => ({\n        label: s.label, grams: s.grams, priceLabel: this.money(s.price),\n        add: () => this.addItem(v.key + \"-\" + s.key, `${v.name} ${s.label}`, s.price),\n      })),\n    }));\n\n    const combos = this.COMBOS.map(c => ({\n      name: c.name, desc: c.desc, items: c.items,\n      priceLabel: this.money(c.price), wasLabel: this.money(c.was),\n      add: () => this.addItem(\"combo-\" + c.key, c.name, c.price),\n    }));\n\n    const cartLines = Object.entries(this.state.cart).map(([id, l]) => ({\n      label: l.label, qty: l.qty, priceLabel: this.money(l.price),\n      totalLabel: this.money(l.price * l.qty),\n      inc: () => this.changeQty(id, 1),\n      dec: () => this.changeQty(id, -1),\n    }));\n\n    const count = Object.values(this.state.cart).reduce((a, l) => a + l.qty, 0);\n\n    const steps = [\n      { n: \"01\", title: \"Corte\", body: \"Posta negra limpia, semi-congelada y cortada a mano contra la fibra en tiras de 4–5 mm uniformes.\" },\n      { n: \"02\", title: \"Curado\", body: \"12 a 24 h en frío con sal kosher. La marinada define cada variante. La marinada define cada variante.\" },\n      { n: \"03\", title: \"Pellicle\", body: \"Se orea 15 min al aire para formar una costra fina que atrapa el humo.\" },\n      { n: \"04\", title: \"Horno · 71 °C\", body: \"Checkpoint de seguridad obligatorio: la carne llega a 71 °C internos y se pasteuriza.\" },\n      { n: \"05\", title: \"Ahumado a leña\", body: \"70–90 °C con humo azul-gris. Esta fase no cocina: solo seca y da sabor.\" },\n      { n: \"06\", title: \"Reposo y vacío\", body: \"Reposa, se prueba doblando la tira y se sella al vacío con fecha de lote.\" },\n    ];\n\n    return {\n      variants, combos, steps, cartLines,\n      cartCount: count,\n      cartOpen: this.state.cartOpen,\n      cartEmpty: count === 0,\n      totalLabel: this.money(this.cartTotal()),\n      toggleCart: this.toggleCart,\n      checkout: this.checkout,\n      waDisplay: this.WA_DISPLAY,\n      waPlainLink: `https://wa.me/${this.WA}?text=${encodeURIComponent(\"Hola Tizón BBQ, quiero hacer un pedido.\")}`,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
